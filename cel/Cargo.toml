[package]
name = "cel"
description = "A parser and interpreter for the Common Expression Language (CEL)"
repository = "https://github.com/cel-rust/cel-rust"
version = "0.14.5"
authors = ["Clark McCauley <me@clarkmccauley.com>", "Alex Snaps <alex@wcgw.dev>"]
edition = "2021"
rust-version = "1.86.0"
license = "MIT"
categories = ["compilers"]

[dependencies]
antlr4rust = "0.6.0"
lazy_static = "1.5.0"
nom = "7.1.3"
chrono = { version = "0.4", default-features = false, features = ["alloc", "serde", "clock"], optional = true }
chrono-tz = { version = "0.10", default-features = false, optional = true }
regex = { version = "1.10.5", optional = true }
# The engine under `regex`, used directly to size compiled patterns for the
# evaluation budget; the features are those `regex` enables itself.
regex-automata = { version = "0.4", optional = true, default-features = false, features = ["alloc", "syntax", "meta", "nfa-pikevm"] }
# The parser under `regex`, used to price the translation of a pattern.
regex-syntax = { version = "0.8", optional = true, default-features = false }
serde = "1.0"
serde_json = { version = "1.0", optional = true }
base64 = { version = "0.22.1", optional = true }
bytes = { version = "1", optional = true }

thiserror = "2"
pastey = "0.2.1"

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }
serde_bytes = "0.11.14"
dhat = { version = "0.3.3" }

[[bench]]
name = "runtime"
harness = false

[[bench]]
name = "parser"
harness = false

[[bench]]
name = "probes"
harness = false

[features]
default = ["regex", "chrono"]
structs = []
parser_pratt = []
bytes = ["dep:bytes"]
json = ["dep:serde_json", "dep:base64"]
regex = ["dep:regex", "dep:regex-automata", "dep:regex-syntax"]
chrono = ["dep:chrono", "dep:chrono-tz"]
dhat-heap = [ ] # if you are doing heap profiling
